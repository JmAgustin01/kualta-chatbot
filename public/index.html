<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat with Kualta Agency</title>
<meta name="description" content="Ask Kualta Agency's virtual assistant about our digital marketing services, rates and free consultation.">
<style>
  :root {
    --bg: #f4f2ee; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6862; --line: #e4e0d8;
    --brand: #1f3a32; --brand-ink: #ffffff; --bot: #f1eee8; --accent: #c8a45a;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #141513; --panel: #1c1d1b; --ink: #ecebe7; --muted: #9a978f; --line: #2c2d2a; --bot: #262724; --brand: #2f5a4d; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--ink);
         display: flex; justify-content: center; }
  .app { width: 100%; max-width: 720px; height: 100dvh; display: flex; flex-direction: column; background: var(--panel);
         border-left: 1px solid var(--line); border-right: 1px solid var(--line); }
  header { display: flex; align-items: center; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
  .logo { width: 40px; height: 40px; border-radius: 50%; background: var(--brand); color: var(--accent); display: grid; place-items: center;
          font-weight: 700; font-size: 18px; flex: none; }
  header h1 { font-size: 16px; margin: 0; }
  header p { margin: 0; font-size: 12.5px; color: var(--muted); }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #3aa76d; margin-right: 5px; vertical-align: 1px; }
  main { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 82%; padding: 10px 14px; border-radius: 16px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .bot { align-self: flex-start; background: var(--bot); border-bottom-left-radius: 4px; }
  .me { align-self: flex-end; background: var(--brand); color: var(--brand-ink); border-bottom-right-radius: 4px; }
  .msg a { color: inherit; }
  .typing { align-self: flex-start; color: var(--muted); font-size: 13px; padding: 4px 6px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 18px 10px; }
  .chips button { border: 1px solid var(--line); background: transparent; color: var(--ink); border-radius: 999px; padding: 6px 12px;
                  font: inherit; font-size: 13.5px; cursor: pointer; }
  .chips button:hover { border-color: var(--brand); }
  form { display: flex; gap: 8px; padding: 12px 14px; border-top: 1px solid var(--line); }
  textarea { flex: 1; resize: none; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; font: inherit;
             background: var(--panel); color: var(--ink); max-height: 120px; }
  textarea:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  form button { border: 0; background: var(--brand); color: var(--brand-ink); border-radius: 12px; padding: 0 18px; font: inherit;
                font-weight: 600; cursor: pointer; }
  form button:disabled { opacity: .5; cursor: default; }
  footer { font-size: 11.5px; color: var(--muted); text-align: center; padding: 0 14px 10px; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo" aria-hidden="true">K</div>
    <div>
      <h1>Kualta Agency</h1>
      <p><span class="dot"></span>Virtual assistant · replies instantly</p>
    </div>
  </header>

  <main id="log" aria-live="polite"></main>

  <div class="chips" id="chips">
    <button type="button">What services do you offer?</button>
    <button type="button">How much is social media management?</button>
    <button type="button">Book a free consultation</button>
    <button type="button">Talk to a human</button>
  </div>

  <form id="form" autocomplete="off">
    <label for="input" class="sr" style="position:absolute;left:-9999px">Message</label>
    <textarea id="input" rows="1" maxlength="1000" placeholder="Type your question…"></textarea>
    <button id="send" type="submit">Send</button>
  </form>
  <footer>Automated assistant for Kualta Agency. Please don't share passwords or card numbers. Type DELETE MY DATA to erase your chat.</footer>
</div>

<script>
  const log = document.getElementById('log');
  const form = document.getElementById('form');
  const input = document.getElementById('input');
  const send = document.getElementById('send');
  const chips = document.getElementById('chips');

  // One random id per browser so the bot remembers this conversation (lead form, follow-ups).
  let visitorId;
  try { visitorId = localStorage.getItem('kualta_visitor'); } catch {}
  if (!visitorId) {
    visitorId = crypto.randomUUID();
    try { localStorage.setItem('kualta_visitor', visitorId); } catch {}
  }

  function add(text, who) {
    const el = document.createElement('div');
    el.className = 'msg ' + who;
    // Build with text nodes only (no innerHTML), turning URLs into links.
    const parts = String(text).split(/(https?:\/\/[^\s]+)/g);
    for (const part of parts) {
      if (/^https?:\/\//.test(part)) {
        const a = document.createElement('a');
        a.href = part; a.textContent = part; a.target = '_blank'; a.rel = 'noopener noreferrer';
        el.appendChild(a);
      } else el.appendChild(document.createTextNode(part));
    }
    log.appendChild(el);
    log.scrollTop = log.scrollHeight;
  }

  async function ask(text) {
    text = text.trim();
    if (!text) return;
    add(text, 'me');
    chips.hidden = true;
    input.value = '';
    send.disabled = true;
    const typing = document.createElement('div');
    typing.className = 'typing'; typing.textContent = 'Kualta is typing…';
    log.appendChild(typing); log.scrollTop = log.scrollHeight;
    try {
      const res = await fetch('/api/web-chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text, visitorId }),
      });
      const data = await res.json().catch(() => ({}));
      typing.remove();
      if (data.text) add(data.text, 'bot');
      else if (!res.ok) add("Sorry, something went wrong. Please try again.", 'bot');
    } catch {
      typing.remove();
      add("I couldn't connect. Check your internet and try again.", 'bot');
    } finally {
      send.disabled = false;
      input.focus();
    }
  }

  form.addEventListener('submit', (e) => { e.preventDefault(); ask(input.value); });
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); ask(input.value); }
  });
  chips.addEventListener('click', (e) => { if (e.target.tagName === 'BUTTON') ask(e.target.textContent); });

  add("Hi! I'm Kualta Agency's virtual assistant. Ask me about our services, rates, or booking a free consultation.", 'bot');
  // Wake the free server early so the first reply is quick.
  fetch('/health').catch(() => {});
</script>
</body>
</html>
