services:
  - type: web
    name: kualta-chatbot
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: EMBEDDING_PROVIDER
        value: gemini
      - key: GEMINI_EMBEDDING_MODEL
        value: gemini-embedding-001
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: GEMINI_FALLBACK_MODELS
        value: gemini-3.5-flash-lite,gemini-2.5-flash-lite
      - key: MAX_OUTPUT_TOKENS
        value: "1024"
      - key: GEMINI_THINKING_LEVEL
        value: low
      - key: TOP_K
        value: "4"
      - key: SIMILARITY_THRESHOLD
        value: "0.60"
      - key: GRAPH_API_VERSION
        value: v25.0
      - key: HUMAN_PAUSE_HOURS
        value: "12"
      # Secrets: set these in the Render dashboard, never in this file
      - key: GEMINI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: MESSENGER_PAGE_ACCESS_TOKEN
        sync: false
      - key: META_VERIFY_TOKEN
        generateValue: true   # Render creates a random value; copy it from the dashboard when needed
      - key: META_APP_ID
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: CHAT_API_KEY
        generateValue: true   # Render creates a random value; copy it from the dashboard when needed
      - key: DATA_HASH_SALT
        generateValue: true   # Render creates a random value; copy it from the dashboard when needed
      - key: CONTACT_EMAIL
        sync: false
      - key: CONTACT_PHONE
        sync: false
